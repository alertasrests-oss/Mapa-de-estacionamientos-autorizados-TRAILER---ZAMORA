.item h3{font-size:14px;margin:1px 0 4px}.item p{font-size:12px;color:var(--muted);margin:2px 0;line-height:1.35}.note{margin-top:7px!important;padding:7px 9px;border-radius:9px;background:#fff5dc;color:#795400!important}.sosnote{background:#fff0f0;color:#8c2626!important}
#map{height:100%;width:100%}.popup h3{margin:0 0 7px;font-size:16px}.popup p{margin:5px 0;font-size:13px}.actions{display:flex;gap:7px;margin-top:10px}.btn{display:inline-block;text-decoration:none;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;background:var(--navy);color:#fff}.btn.secondary{background:#eaf1f7;color:var(--navy)}

const map=L.map('map',{zoomControl:true}).setView([-27.6,-70.5],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const markers={}; let zone='Todos';
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function maps(p){return p.lat!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address)}`}
function icon(status,n){let c=status==='sos'?'#d94141':status==='warning'?'#f2a900':'#18a66a';return L.divIcon({className:'',html:`<div style="width:30px;height:30px;border-radius:10px 10px 10px 2px;transform:rotate(-45deg);background:${c};border:3px solid white;box-shadow:0 2px 7px #0004;display:grid;place-items:center"><b style="transform:rotate(45deg);color:white;font:11px system-ui">${n}</b></div>`,iconSize:[30,30],iconAnchor:[15,28]})}
points.forEach(p=>{if(p.lat!=null){let m=L.marker([p.lat,p.lng],{icon:icon(p.status,p.n)}).addTo(map);m.bindPopup(()=>`<div class="popup"><h3>${p.n}. ${esc(p.name)}</h3><p>📍 ${esc(p.address)}</p>${p.phone?`<p>📞 ${esc(p.phone)}</p>`:'<p>📞 Teléfono no informado</p>'}<p>🧾 Registro: <b>${esc(p.registro)}</b></p>${p.note?`<p><b>⚠ ${esc(p.note)}</b></p>`:''}<div class="actions"><a class="btn" target="_blank" href="${maps(p)}">Cómo llegar</a>${p.phone?`<a class="btn secondary" href="tel:${p.phone.split('/')[0].replace(/\s/g,'')}">Llamar</a>`:''}</div></div>`);markers[p.n]=m}})
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const arr=points.filter(p=>(zone==='Todos'||p.zone===zone)&&(`${p.name} ${p.address} ${p.phone} ${p.registro}`.toLowerCase().includes(q)));
 document.getElementById('count').textContent=arr.length;
 document.getElementById('list').innerHTML=arr.map(p=>`<div class="item" onclick="focusPoint(${p.n})"><div class="row"><div class="badge ${p.status}">${p.n}</div><div><h3>${esc(p.name)}</h3><p>📍 ${esc(p.address)}</p>${p.phone?`<p>📞 ${esc(p.phone)}</p>`:'<p>📞 Teléfono no informado</p>'}<p>🧾 Registro: <b>${esc(p.registro)}</b></p>${p.note?`<p class="note ${p.status==='sos'?'sosnote':''}">⚠ ${esc(p.note)}</p>`:''}<p>🗺️ <a href="${maps(p)}" target="_blank" onclick="event.stopPropagation()">Abrir Google Maps</a></p></div></div></div>`).join('');
}
window.focusPoint=n=>{const p=points.find(x=>x.n===n); if(markers[n]){map.setView([p.lat,p.lng],14);markers[n].openPopup()} else window.open(maps(p),'_blank')};
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');zone=b.dataset.zone;render()});
render();
